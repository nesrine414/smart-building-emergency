
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <span class="logo-icon">🏢</span>
        <h1>Smart Building</h1>
        <p class="subtitle">Emergency Safety System</p>
      </div>
    </div>

    <div class="login-form">
      @if (errorMessage()) {
        <div class="error-banner" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <p class="subtitle">
        Connectez-vous avec votre compte Smart Building.
        Vous serez redirigé vers le serveur sécurisé IAM.
      </p>

      <button
        type="button"
        class="btn-login"
        [disabled]="isLoading()"
        (click)="onSubmit()"
      >
        @if (isLoading()) {
          <span class="spinner"></span>
          Connexion en cours...
        } @else {
          Se connecter avec IAM
        }
      </button>
    </div>
  </div>
</div>
