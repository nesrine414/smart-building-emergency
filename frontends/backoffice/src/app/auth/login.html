<div class="login-page">
  <section class="login-card">
    <div class="login-brand">
      <div class="brand-mark">SB</div>
      <p class="eyebrow">SMART BUILDING</p>
      <h1>Back Office</h1>
      <p class="subtitle">
        Secure Emergency Management Portal
      </p>
    </div>

    @if (errorMessage()) {
      <div class="error-message" role="alert">
        {{ errorMessage() }}
      </div>
    }

    <div class="login-form">
      <button
        type="button"
        (click)="startLogin()"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Redirecting to IAM...' : 'Sign In' }}
      </button>
    </div>

    <p class="security-note">
      Centralized authentication. Access restricted to administrators.
    </p>
  </section>
</div>
