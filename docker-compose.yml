services:
  mongodb:
    image: mongo:7
    container_name: smart-building-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  hivemq:
    image: hivemq/hivemq-ce
    container_name: smart-building-hivemq
    restart: unless-stopped
    ports:
      - "1883:1883"

  nodered:
    image: nodered/node-red:latest
    container_name: smart-building-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data

volumes:
  mongodb_data: