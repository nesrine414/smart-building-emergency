
services:
  mongodb:
    image: mongo:7
    container_name: smart-building-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  hivemq:
    image: hivemq/hivemq-ce
    container_name: smart-building-hivemq
    restart: unless-stopped
    ports:
      - "1883:1883"

volumes:
  mongodb_data:
