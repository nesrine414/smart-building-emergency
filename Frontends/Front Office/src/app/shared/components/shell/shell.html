<!-- Top Header Bar -->
<header class="top-bar">
  <div class="top-bar-left">
    <span class="app-logo">🏢</span>
    <span class="app-name">SafeBuilding</span>
  </div>
  <div class="top-bar-right">
    @if (criticalCount() > 0) {
      <a routerLink="/alerts" class="critical-badge">
        🚨 {{ criticalCount() }}
      </a>
    }
    <a routerLink="/notifications" class="notif-btn">
      🔔
      @if (unreadCount() > 0) {
        <span class="notif-count">{{ unreadCount() }}</span>
      }
    </a>
  </div>
</header>

<!-- Main Content -->
<main class="main-content">
  <router-outlet />
</main>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">Home</span>
  </a>
  <a routerLink="/alerts" routerLinkActive="active" class="nav-item">
    <span class="nav-icon">🚨</span>
    <span class="nav-label">Alerts</span>
  </a>
  <a routerLink="/building-map" routerLinkActive="active" class="nav-item">
    <span class="nav-icon">🗺️</span>
    <span class="nav-label">Map</span>
  </a>
  <a routerLink="/ai-assistant" routerLinkActive="active" class="nav-item">
    <span class="nav-icon">🤖</span>
    <span class="nav-label">AI</span>
  </a>
  <a routerLink="/profile" routerLinkActive="active" class="nav-item">
    <span class="nav-icon">👤</span>
    <span class="nav-label">Profile</span>
  </a>
</nav>
