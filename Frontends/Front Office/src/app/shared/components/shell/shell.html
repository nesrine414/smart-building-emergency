
<div class="app-shell">

  <!-- Top Header -->
  <header class="top-bar">
    <a routerLink="/dashboard" class="brand" aria-label="Smart Building Emergency - Accueil">
      <span class="brand-icon">🏢</span>

      <span class="brand-content">
        <span class="app-name">Smart Building Emergency</span>
        <span class="brand-tagline">SafeBuilding · Smart Safety Platform</span>
      </span>
    </a>

    <div class="top-bar-right">

      @if (criticalCount() > 0) {
        <a
          routerLink="/alerts"
          class="critical-badge"
          aria-label="Consulter les alertes critiques"
        >
          <span class="critical-dot"></span>
          <span>{{ criticalCount() }} Critical</span>
        </a>
      }

      <a
        routerLink="/notifications"
        routerLinkActive="selected"
        class="notif-btn"
        aria-label="Notifications"
      >
        <span class="notif-icon">🔔</span>

        @if (unreadCount() > 0) {
          <span class="notif-count">{{ unreadCount() }}</span>
        }
      </a>

    </div>
  </header>

  <!-- Main Page Content -->
  <main class="main-content">
    <router-outlet />
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Navigation principale">

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <span class="nav-icon">⌂</span>
      <span class="nav-label">Home</span>
    </a>

    <a
      routerLink="/alerts"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">🚨</span>
      <span class="nav-label">Alerts</span>
    </a>

    <a
      routerLink="/building-map"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">🗺️</span>
      <span class="nav-label">Building</span>
    </a>

    <a
      routerLink="/ai-assistant"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">🤖</span>
      <span class="nav-label">AI Assistant</span>
    </a>

    <a
      routerLink="/profile"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profile</span>
    </a>

  </nav>

</div>
