<div class="page-container">
  <div class="page-header">
    <div>
      <h1>Notifications</h1>
      <p>{{ unreadCount() }} notification(s) non lue(s)</p>
    </div>

    <button
      class="mark-all-btn"
      type="button"
      (click)="markAllAsRead()"
      [disabled]="unreadCount() === 0">
      Tout marquer comme lu
    </button>
  </div>

  <div class="notifications-list">
    @for (notif of notifications(); track notif.id) {
      <button
        type="button"
        class="notif-card"
        [class.unread]="!notif.read"
        [class]=" 'notif-card ' + getSeverityClass(notif.severity) + (notif.read ? '' : ' unread')"
        (click)="openNotification(notif)">

        <div class="notif-header">
          <h3>{{ notif.title }}</h3>
          <span class="notif-time">
            {{ getTimeAgo(notif.createdAt) }}
          </span>
        </div>

        <p>{{ notif.message }}</p>

        @if (!notif.read) {
          <span class="unread-dot"></span>
        }

        <span class="notification-action">Voir les incidents</span>
      </button>
    } @empty {
      <div class="empty-state">
        <span class="empty-icon">🔔</span>
        <h3>Aucun incident enregistré</h3>
        <p>Les nouvelles notifications apparaîtront ici automatiquement.</p>
      </div>
    }
  </div>
</div>
