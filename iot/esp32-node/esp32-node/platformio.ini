
; Nœud capteurs du Smart Building Emergency
; Carte : LilyGO T-Call (ESP32-WROVER-B + SIM800L), testée en "ESP32 Dev Module"

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Port détecté automatiquement. Si plusieurs ports existent, décommenter et mettre le bon :
; upload_port = COM5
; monitor_port = COM5
monitor_speed = 115200

lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.9
