<div class="page-container">
  <div class="page-header">
    <h1>🔔 Notifications</h1>
    <button class="mark-all-btn" (click)="markAllAsRead()">Mark all as read</button>
  </div>

  <div class="notifications-list">
    @for (notif of notifications(); track notif.id) {
      <div class="notif-card" [class.unread]="!notif.read" [class]="getSeverityClass(notif.severity)" (click)="markAsRead(notif.id)">
        <div class="notif-header">
          <h3>{{ notif.title }}</h3>
          <span class="notif-time">{{ getTimeAgo(notif.createdAt) }}</span>
        </div>
        <p>{{ notif.message }}</p>
        @if (!notif.read) {
          <span class="unread-dot"></span>
        }
      </div>
    } @empty {
      <div class="empty-state">
        <span class="empty-icon">🔕</span>
        <h3>No Notifications</h3>
        <p>You're all caught up.</p>
      </div>
    }
  </div>
</div>
