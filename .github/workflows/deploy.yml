# Pipeline CI/CD de Smart Building Emergency (étape 5, personne 1).
#
#   pull_request vers main : tests (Java + Python) et build ; rien n'est déployé.
#   push sur main          : tests, build, puis déploiement sur le serveur.
#   lancement manuel       : onglet Actions > CI/CD > Run workflow (déploie si lancé sur main).
#
# Tests et build tournent sur les machines de GitHub. Le déploiement tourne sur le serveur
# lui-même, par le runner « sbe-server » (deploy/server/install-runner.sh) : aucun port SSH ouvert
# à GitHub, aucun secret dans GitHub. Les secrets restent dans /opt/sbe/.env sur le serveur.
# Dépôt privé obligatoire tant que ce runner existe (deploy/CI-CD.md, « Sécurité »).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Une pull request mise à jour annule son exécution précédente ; main va toujours au bout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-java:
    name: Tests Java (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Rapports JUnit
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-junit
          path: '**/target/surefire-reports/'
          retention-days: 7
          if-no-files-found: ignore

  test-python:
    name: Tests Python (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: iot/mlops/requirements-docker.txt
      - name: Dépendances (versions de l'image sbe-ml)
        run: python -m pip install -r iot/mlops/requirements-docker.txt "pytest==9.2.0"
      - name: pytest
        run: python -m pytest -q infra/mqtt/tests iot/mlops/tests iot/llm/tests deploy/tests

  build:
    name: Build (WAR + PWA)
    needs: [test-java, test-python]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/*/package-lock.json
      - name: WAR (déjà testés au job précédent)
        run: mvn -B -ntp -DskipTests package
      - name: PWA et assemblage
        run: bash deploy/ci/build-artifacts.sh "$RUNNER_TEMP/sbe-app"
      - uses: actions/upload-artifact@v7
        with:
          name: sbe-app
          path: ${{ runner.temp }}/sbe-app/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Déploiement sur le serveur
    needs: build
    # Jamais pour une pull request : seul main, déjà relu et testé, arrive sur le serveur.
    # Et seulement quand le serveur existe : variable SBE_DEPLOY_ENABLED = true dans
    # Settings > Secrets and variables > Actions > Variables (sinon le job est « skipped »).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SBE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, sbe-server]
    timeout-minutes: 30
    concurrency:
      group: deploy-sbe-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: sbe-app
          path: ${{ runner.temp }}/sbe-app
      - name: deploy-app.sh (retour automatique en cas d'échec)
        run: bash deploy/server/deploy-app.sh --sha "$GITHUB_SHA" "$RUNNER_TEMP/sbe-app"
