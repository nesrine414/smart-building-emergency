# Pipeline de livraison de Smart Building Emergency (étape 5, personne 1).
#
# Consigne de l'encadrant : on travaille sur main ; les fichiers de tests vivent sur la branche
# « tests » (pipeline .github/workflows/tests.yml). D'où :
#   push sur main     : build (Maven + les deux PWA), puis déploiement sur le serveur.
#   lancement manuel  : onglet Actions > Livraison > Run workflow (sur main).
#   autres branches   : rien ici.
# Maven lance quand même les tests JUnit présents sur main (mvn package) : un échec bloque le
# déploiement de ce commit, et la version en ligne ne change pas.
#
# Le build tourne sur les machines de GitHub. Le déploiement tourne sur le serveur lui-même, par
# le runner « sbe-server » (deploy/server/install-runner.sh) : aucun port SSH ouvert à GitHub,
# aucun secret dans GitHub. Les secrets restent dans /opt/sbe/.env sur le serveur.
# Dépôt privé obligatoire tant que ce runner existe (deploy/CI-CD.md, « Sécurité »).
name: Livraison

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livraison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (WAR + PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontends/*/package-lock.json
      - name: WAR (mvn package, tests JUnit de main compris)
        run: mvn -B -ntp package
      - name: PWA et assemblage
        run: bash deploy/ci/build-artifacts.sh "$RUNNER_TEMP/sbe-app"
      - uses: actions/upload-artifact@v7
        with:
          name: sbe-app
          path: ${{ runner.temp }}/sbe-app/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Déploiement sur le serveur
    needs: build
    # Seulement main, et seulement quand le serveur existe : variable SBE_DEPLOY_ENABLED = true dans
    # Settings > Secrets and variables > Actions > Variables (sinon le job est « skipped »).
    if: github.ref == 'refs/heads/main' && vars.SBE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, sbe-server]
    timeout-minutes: 30
    concurrency:
      group: deploy-sbe-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: sbe-app
          path: ${{ runner.temp }}/sbe-app
      - name: deploy-app.sh (retour automatique en cas d'échec)
        run: bash deploy/server/deploy-app.sh --sha "$GITHUB_SHA" "$RUNNER_TEMP/sbe-app"
